name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lxga-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, statistics, data and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      LXGA_DEMO_USERS: "5000"
      LXGA_DEMO_SEED: "42"
      LXGA_COPILOT_NARRATIVE_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and QA dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q analytics backend scripts tests

      - name: Lint
        run: python -m ruff check analytics backend scripts tests

      - name: Verify formatting
        run: python -m ruff format --check analytics backend scripts tests

      - name: Run statistical, data-quality and API tests
        run: >-
          python -m pytest
          --cov=analytics
          --cov=backend
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
          --junitxml=pytest-results.xml

      - name: Generate and validate public analytics package
        run: python -m scripts.export_copilot

      - name: Enforce release-tree privacy and packaging policy
        run: python -m scripts.build_release --check-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore

  web:
    name: React dashboard quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend unit and contract tests
        working-directory: web
        run: npm test

      - name: Lint and typecheck
        working-directory: web
        run: npm run lint && npm run typecheck

      - name: Build production dashboard
        working-directory: web
        run: npm run build

  containers:
    name: Docker Compose build and end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, web]
    env:
      LXGA_DEMO_USERS: "5000"
      LXGA_DEMO_SEED: "42"
      LXGA_COPILOT_NARRATIVE_MODE: deterministic
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend and frontend images
        run: docker compose build --pull

      - name: Start the complete local stack
        run: docker compose up --detach --wait --wait-timeout 480

      - name: Verify browser, API and reverse-proxy data path
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health --output /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/analytics/bundle --output /tmp/backend-bundle.json
          curl --fail --silent --show-error http://127.0.0.1:8501/ --output /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8501/api/v1/analytics/bundle --output /tmp/frontend-bundle.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text(encoding="utf-8"))
          backend = json.loads(Path("/tmp/backend-bundle.json").read_text(encoding="utf-8"))
          frontend = json.loads(Path("/tmp/frontend-bundle.json").read_text(encoding="utf-8"))
          assert health["status"] == "ok"
          assert backend == frontend
          assert backend["meta"]["product_name"] == "Liu Xi Growth & Experiments"
          assert "evals" not in backend
          assert "<div id=\"root\"></div>" in Path("/tmp/index.html").read_text(encoding="utf-8")
          PY

      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-compose-diagnostics
          path: docker-compose.log
          if-no-files-found: ignore

      - name: Stop the complete local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
