[project]
name = "liu-xi-growth-analytics-portfolio"
version = "1.1.0"
description = "Evidence-bound growth diagnosis, experimentation and automated decision briefing"
requires-python = ">=3.10,<3.14"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
public-data = [
  "google-cloud-bigquery>=3.29,<4",
  "pyarrow>=19,<22",
]

[project.scripts]
liu-xi-analytics-generate = "scripts.generate_demo_data:main"
liu-xi-analytics-api = "backend.main:run"
liu-xi-analytics-export = "scripts.export_copilot:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics", "backend", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
